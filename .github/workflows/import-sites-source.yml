name: Import published Sites source
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-sites-source.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-sites-source-v11
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download and validate the published source snapshot
        env:
          SOURCE_URL: https://potion-black-market-tamother.iamjaeyang.chatgpt.site/downloads/potion-black-market-source.zip
          SOURCE_SHA256: 50d8a7131a4a9a7128db9428d9a5c0840132c352b5a461a37e675b389b7a5677
        run: |
          set -euo pipefail
          curl --fail --show-error --location --retry 3 --max-time 180 "$SOURCE_URL" --output "$RUNNER_TEMP/sites-source.zip"
          printf '%s  %s\n' "$SOURCE_SHA256" "$RUNNER_TEMP/sites-source.zip" | sha256sum --check --strict -
          python3 - <<'PY'
          import json, os, pathlib, stat, zipfile
          root = pathlib.Path.cwd()
          if (root / "src").exists():
              raise SystemExit("Source already exists; stop to preserve concurrent work.")
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "sites-source.zip"
          with zipfile.ZipFile(archive) as z:
              entries = [i for i in z.infolist() if not i.is_dir()]
              if len(entries) != 133:
                  raise SystemExit("Unexpected source file count.")
              planned = []
              for info in entries:
                  name = pathlib.PurePosixPath(info.filename)
                  if name.is_absolute() or ".." in name.parts or not name.parts or name.parts[0] != "potion-black-market":
                      raise SystemExit("Unsafe archive path.")
                  rel = pathlib.Path(*name.parts[1:])
                  if not rel.parts or rel.parts[0] == ".git" or stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit("Unsafe source entry.")
                  planned.append((info, rel))
              names = {str(rel) for _, rel in planned}
              required = {"package.json", "package-lock.json", "src/world/Sprite.tsx", "src/engine/game.ts", ".openai/hosting.json"}
              if not required <= names:
                  raise SystemExit("Incomplete source snapshot.")
              manifest = json.loads(z.read("potion-black-market/.openai/hosting.json"))
              if manifest.get("project_id") != "appgprj_6adb531b82688191b9364b9012a61884":
                  raise SystemExit("Wrong Sites project.")
              for info, rel in planned:
                  dest = root / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(info))
          (root / "docs" / "GITHUB-SYNC.md").write_text(
              "# Source synchronization\n\n"
              "Imported the complete downloadable source snapshot from the existing public Sites project, version 11.\n\n"
              "- Sites project: appgprj_6adb531b82688191b9364b9012a61884\n"
              "- Published package commit: d435111aae83eaac98456d569299155b5d728f92\n"
              "- Runtime source snapshot commit: 3c1c030e45147d6fb462426fa8d5f5441bec3de1\n"
              "- Source ZIP SHA-256: " + os.environ["SOURCE_SHA256"] + "\n"
              "- Imported source files: 133, including code, tests, configuration, fonts and pixel assets.\n\n"
              "The downloadable source intentionally excludes recursive public/downloads attachments. "
              "The published package commit only adds those release downloads to the runtime source snapshot.\n\n"
              "GitHub main is now available for development checkouts. This was a one-time import, not automatic ongoing synchronization.\n",
              encoding="utf-8",
          )
          print("Imported 133 verified source files.")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the imported project
        run: |
          npm ci
          npm test -- --reporter=dot
          npm run build
      - name: Commit the source and remove this one-time importer
        run: |
          set -euo pipefail
          git rm .github/workflows/import-sites-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Sync complete Potion Black Market source from published Sites v11'
          git push origin HEAD:main
